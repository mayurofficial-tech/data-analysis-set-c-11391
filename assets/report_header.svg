<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f5e9d0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#paper)"/>
  <rect x="10" y="10" width="880" height="260" rx="10" fill="none" stroke="#1b4332" stroke-width="3"/>
  <rect x="18" y="18" width="864" height="244" rx="7" fill="none" stroke="#b08d57" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- ruled lines -->
  <g stroke="#1b4332" stroke-opacity="0.08">
    <line x1="30" y1="180" x2="500" y2="180"/>
    <line x1="30" y1="205" x2="500" y2="205"/>
    <line x1="30" y1="230" x2="500" y2="230"/>
  </g>

  <!-- text -->
  <text x="44" y="62" font-family="Georgia, serif" font-size="14" fill="#b08d57" letter-spacing="6">ACADEMIC REPORT CARD</text>
  <text x="44" y="112" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1b4332">Training Performance</text>
  <text x="44" y="154" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1b4332">Analysis</text>
  <text x="44" y="200" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#555">Which course needs support? Which batch performs best?</text>

  <!-- animated grade bars -->
  <g>
    <line x1="560" y1="225" x2="850" y2="225" stroke="#1b4332" stroke-width="2"/>
    <rect x="580" y="225" width="36" height="0" rx="4" fill="#2d6a4f">
      <animate attributeName="height" values="0;110;110;0" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;115;115;225" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="225" width="36" height="0" rx="4" fill="#52b788">
      <animate attributeName="height" values="0;70;70;0" keyTimes="0;0.45;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;155;155;225" keyTimes="0;0.45;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="225" width="36" height="0" rx="4" fill="#d62828">
      <animate attributeName="height" values="0;40;40;0" keyTimes="0;0.55;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;185;185;225" keyTimes="0;0.55;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="225" width="36" height="0" rx="4" fill="#74c69d">
      <animate attributeName="height" values="0;90;90;0" keyTimes="0;0.65;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="225;135;135;225" keyTimes="0;0.65;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pass line -->
  <line x1="560" y1="170" x2="850" y2="170" stroke="#b08d57" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="852" y="174" font-family="Georgia, serif" font-size="12" fill="#b08d57">50</text>

  <!-- gold seal -->
  <g transform="translate(790 62)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <polygon points="0,-34 8,-14 30,-17 17,0 30,17 8,14 0,34 -8,14 -30,17 -17,0 -30,-17 -8,-14" fill="#e0b84f"/>
    </g>
    <circle r="20" fill="#fffaf0" stroke="#b08d57" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1b4332">≥ 50</text>
  </g>
</svg>
